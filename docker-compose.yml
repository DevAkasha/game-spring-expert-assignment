services:
  mysql:
    image: mysql:8.4
    container_name: gameexpert-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gameexpert
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: gameexpert-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
